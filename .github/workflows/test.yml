name: test

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # npm test 的 pretest 会先跑 eslint，再跑纯 Node 单元测试。
      # 集成测试需要下载 VS Code，不进 CI。
      - run: npm test
